services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: customer_task_portal
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - portal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portal -d customer_task_portal']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  portal_pgdata:
